<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fake Money Game - For Jokes Only</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0f0f23;
  color: #e0e0ff;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 420px;
  margin: 0 auto;
}

.balance {
  font-size: 3.4rem;
  font-weight: bold;
  color: #00ff9d;
  text-align: center;
  margin: 30px 0;
  text-shadow: 0 0 20px #00ff9d55;
}

.history {
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 16px;
  margin: 20px 0;
  font-family: monospace;
  height: 180px;
  overflow-y: auto;
}

.btn-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 30px 0;
}

button {
  padding: 18px;
  font-size: 1.4rem;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.green { background: #00c853; color: white; }
.violet { background: #aa00ff; color: white; }
.red { background: #d50000; color: white; }
.big { background: linear-gradient(45deg, #ff6d00, #ffab00); color: white; }
.small { background: linear-gradient(45deg, #0288d1, #0277bd); color: white; }

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

button:active {
  transform: translateY(1px);
}

.admin {
  margin-top: 60px;
  padding: 20px;
  background: rgba(255,0,0,0.12);
  border-radius: 12px;
  border: 1px solid #ff174455;
}

input, select {
  padding: 12px;
  font-size: 1.1rem;
  margin: 8px 0;
  width: 100%;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #444;
  background: #1a1a2e;
  color: white;
}

.secret {
  color: #444;
  font-size: 0.8rem;
}
</style>
</head>

<body>

<div class="container">
  <div class="balance">₹10,000</div>

  <div class="btn-group">
    <button class="green">Win</button>
    <button class="red">Lose</button>
    <button class="big">Big</button>
    <button class="small">Small</button>
  </div>

  <div class="history">
    Game history will appear here...
  </div>

  <div class="admin">
    <h3>Admin Panel</h3>
    <input type="number" placeholder="Enter amount">
    <select>
      <option>Win</option>
      <option>Lose</option>
    </select>
    <button class="violet">Apply</button>
    <p class="secret">For testing only</p>
  </div>
</div>

</body>
</html>
